name: Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/time-webapp:latest
          ${{ secrets.DOCKER_USERNAME }}/time-webapp:${{ github.sha }}
    
    - name: Deploy to k3s
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      run: |
        mkdir -p $HOME/.kube
        echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
        
        kubectl set image deployment/time-webapp \
          time-webapp=${{ secrets.DOCKER_USERNAME }}/time-webapp:${{ github.sha }} \
          --record
        
        kubectl rollout status deployment/time-webapp -n default
